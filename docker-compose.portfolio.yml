name: reliable-commerce-demo
services:
  db:
    image: pgvector/pgvector:pg16
    ports: ["127.0.0.1:55432:5432"]
    environment:
      POSTGRES_USER: demo
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:?Run scripts/demo.sh first}
      POSTGRES_DB: reliable_commerce_demo
    volumes:
      - portfolio-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo -d reliable_commerce_demo"]
      interval: 2s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:56379:6379"]
volumes:
  portfolio-data:
