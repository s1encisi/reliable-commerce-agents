# 说明：本文件描述真实数据库结构。其中**枚举值（如 Electronics、bronze、east）是数据库
# 实际存储值，必须保持英文原样**——模型需要按这些字面值构造查询条件；中文注释仅为帮助
# 模型把中文用户表述映射到这些英文取值。
user: |
  ## 数据库：用户
  - **users**：id (UUID)、email、name、role、loyalty_tier、total_spend、created_at、is_active
    - role 取值：customer（客户）、power_user（高级用户）、seller（商家）、admin（管理员）
    - 会员等级 loyalty_tier：bronze（青铜，默认）、silver（白银，累计消费 >= ¥1000，9.5 折）、gold（黄金，累计消费 >= ¥3000，9 折 + 免运费 + 优先客服）
    - 当前用户的 email 可直接获取——查询时务必用它限定数据范围

order: |
  ## 数据库：订单与退货
  - **orders**：id (UUID)、user_id (FK->users)、status、total、shipping_address (JSONB: street/city/state/zip/country)、shipping_carrier、tracking_number、coupon_code、discount_amount、created_at
    - 状态流转：placed -> confirmed -> shipped -> out_for_delivery -> delivered
    - 另有：cancelled（可由 placed/confirmed 转入）、returned（由 delivered 转入）
  - **order_items**：order_id (FK->orders)、product_id (FK->products)、quantity、unit_price、subtotal
  - **order_status_history**：order_id (FK->orders)、status、notes、location、timestamp——完整物流轨迹
  - **returns**：order_id (FK->orders)、user_id (FK->users)、reason、status、return_label_url、refund_method、refund_amount、created_at、resolved_at
    - 退货状态流转：requested -> approved -> shipped_back -> received -> refunded（或 denied）
    - 退款方式 refund_method：original_payment（原路退回）、store_credit（平台余额）
    - 退货窗口：签收后 30 天内

product: |
  ## 数据库：商品
  - **products**：id (UUID)、name、description、category、brand、price、original_price、image_url、rating (1.0-5.0)、review_count、specs (JSONB)、is_active、created_at
    - category 取值：Electronics（数码电子）、Clothing（服饰）、Home（家居）、Sports（运动）、Books（图书）
    - specs JSONB 随 category 而变（例如 Electronics：battery、weight、connectivity；Clothing：material、fit）
    - 若 original_price > price，则该商品正在促销
  - **product_embeddings**：product_id (FK->products)、embedding (vector 1536-dim)——用于语义检索
  - **price_history**：product_id (FK->products)、price、recorded_at——最近 90 天的每日价格

inventory: |
  ## 数据库：库存与配送
  - **warehouses**：id (UUID)、name、location、region
    - region 取值：east（Richmond VA）、central（Dallas TX）、west（Portland OR）
  - **warehouse_inventory**：warehouse_id + product_id（复合主键）、quantity、reorder_threshold
    - low_stock 判定：quantity <= reorder_threshold
  - **carriers**：id (UUID)、name、speed_tier、base_rate
    - speed_tier 取值：standard（5-7 天，约 ¥6-10）、express（2-3 天，约 ¥15-21）、overnight（次日达，约 ¥30-40）
  - **shipping_rates**：carrier_id (FK->carriers)、region_from、region_to、price、estimated_days_min、estimated_days_max
  - **restock_schedule**：product_id (FK->products)、warehouse_id (FK->warehouses)、expected_quantity、expected_date

pricing: |
  ## 数据库：定价与促销
  - **coupons**：code (unique)、description、discount_type、discount_value、min_spend、max_discount、usage_limit、times_used、valid_from、valid_until、applicable_categories (TEXT[])、user_specific_email、is_active
    - discount_type 取值：percentage（按比例，如 9 折）、fixed（固定金额，如立减 ¥25）
    - applicable_categories 为 NULL 表示适用于全部分类，否则是形如 {Electronics,Home} 的数组
    - user_specific_email 为 NULL 表示任何用户可用，否则为专属优惠券的指定邮箱
  - **promotions**：name、type、rules (JSONB)、start_date、end_date、is_active
    - type 取值：bundle（组合购优惠）、buy_x_get_y（满件优惠）、flash_sale（分类限时折扣）
    - rules JSONB 随 type 而变：bundle 为 {products: [...], discount_pct: N}，buy_x_get_y 为 {category, min_quantity, discount_pct}
  - **loyalty_tiers**：name、min_spend、discount_pct、free_shipping_threshold、priority_support
    - bronze：累计消费 ¥0 起，无折扣
    - silver：累计消费 ¥1000 起，9.5 折，满 ¥75 免运费
    - gold：累计消费 ¥3000 起，9 折，永久免运费，优先客服

review: |
  ## 数据库：评论
  - **reviews**：id (UUID)、product_id (FK->products)、user_id (FK->users)、rating (1-5 整数)、title、body、verified_purchase (boolean)、helpful_count、is_flagged（可疑）、created_at
    - verified_purchase：评价者确实购买过该商品时为 true
    - is_flagged：被判定为疑似虚假评价时为 true（套话、集中五星、未验证购买）
    - 全站评分分布大致为：五星 35%、四星 35%、三星 15%、二星 10%、一星 5%
