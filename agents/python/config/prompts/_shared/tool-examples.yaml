# 说明：工具名、参数名、返回字段名均为代码契约，必须保持英文原样；仅说明文字中文化。
order_tools: |
  ## 工具使用指南

  ### get_user_orders(status?, limit?)
  列出当前用户的订单。无需传入 email——它会自动使用已登录用户。
  - `get_user_orders()` -> 全部订单
  - `get_user_orders(status="shipped")` -> 仅已发货订单
  - `get_user_orders(status="placed", limit=5)` -> 最多 5 条已下单订单
  - 合法状态：placed, confirmed, shipped, out_for_delivery, delivered, cancelled, returned
  -> 返回：[{"order_id": "uuid", "status": "shipped", "total": 129.99, "item_count": 2, "date": "2026-03-15T..."}]

  ### get_order_details(order_id)
  完整订单信息，含商品明细、配送信息与状态轨迹。
  -> 返回：{"order_id": "...", "status": "shipped", "total": 129.99, "items": [{"name": "Sony WH-1000XM5", "quantity": 1, "unit_price": 299.99}], "status_history": [{"status": "placed", "timestamp": "..."}], "shipping_address": {"street": "...", "city": "...", "state": "..."}}

  ### get_order_tracking(order_id)
  已发货订单的最新物流状态与完整轨迹。
  -> 返回：{"current_status": "shipped", "location": "分拨中心", "timeline": [...]}

  ### cancel_order(order_id, reason)
  取消订单。仅当状态为 "placed" 或 "confirmed" 时可用。
  -> 返回：{"success": true, "refund_amount": 129.99} 或 {"error": "无法取消——订单已发货"}

  ### modify_order(order_id, new_address)
  修改收货地址。仅在尚未发货时可用。
  - new_address 必须包含：street, city, state, zip, country

  ### check_return_eligibility(order_id)
  判断订单是否可退货（须为签收后 30 天内）。
  -> 返回：{"eligible": true, "days_remaining": 15} 或 {"eligible": false, "reason": "..."}

  ### initiate_return(order_id, reason, refund_method)
  发起退货。refund_method 取值："original_payment" 或 "store_credit"
  -> 返回：{"return_id": "...", "label_url": "https://...", "status": "requested"}

  ### get_user_profile()
  当前用户的资料。无需参数。
  -> 返回：{"name": "张伟", "email": "zhangwei@example.com", "role": "customer", "loyalty_tier": "gold", "total_spend": 4200.00}

product_tools: |
  ## 工具使用指南

  ### search_products(query, category?, min_price?, max_price?, min_rating?, sort_by?, limit?)
  按关键词检索，可附加筛选条件。
  - `search_products(query="无线降噪耳机")` -> 文本检索
  - `search_products(query="跑鞋", category="Clothing", max_price=150)` -> 带筛选
  - sort_by 取值：price_asc, price_desc, rating, newest
  -> 返回：[{"id": "uuid", "name": "Sony WH-1000XM5", "price": 299.99, "rating": 4.7, "category": "Electronics", "on_sale": true}]

  ### get_product_details(product_id)
  含规格参数的完整商品信息。
  -> 返回：{"id": "...", "name": "...", "description": "...", "specs": {"battery": "30 hours", "weight": "250g"}, "rating": 4.7, "review_count": 45}

  ### compare_products(product_ids)
  2-3 件商品的并排对比。传入 UUID 列表。

  ### semantic_search(query, limit?)
  混合检索（向量嵌入 + 全文检索，融合排序），适合模糊、描述性的查询。最适用于："适合冬天穿的保暖单品"、"送技术爱好者的礼物"、"新手健身装备"
  -> 返回：[{"id": "...", "name": "...", "similarity": 0.89, "score": 0.03252, ...}]
  -> 当商品仅由文本检索命中的，`similarity` 为 null；请按 `score` 排序，该字段本身已是有序的。

  ### find_similar_products(product_id, limit?)
  基于向量嵌入查找与给定商品相似的商品。

  ### get_trending_products(category?, days?, limit?)
  最近 N 天内下单量最多的商品。

  ### check_stock(product_id)
  各仓库的库存水平。
  -> 返回：{"in_stock": true, "total_quantity": 150, "warehouses": [{"warehouse": "East", "quantity": 80}, ...]}

  ### get_price_history(product_id, days?)
  价格趋势。days 取值：30、60 或 90。
  -> 返回：{"current_price": 99.99, "average_price": 112.50, "min_price": 89.99, "trend": "decreasing", "is_good_deal": true}

  ### get_purchase_history(limit?)
  当前用户的历史订单，用于个性化推荐。

pricing_tools: |
  ## 工具使用指南

  ### validate_coupon(code, cart_total?, category?)
  校验优惠券码是否有效并计算优惠金额。
  - `validate_coupon(code="EXAMPLECODE")` -> 基础校验
  - `validate_coupon(code="EXAMPLECODE", cart_total=200, category="Electronics")` -> 带上下文校验
  -> 返回：{"valid": true, "discount_amount": 30.00, "description": "数码电子类 85 折"} 或 {"valid": false, "reason": "优惠券已过期"}
  注意：上文的 "EXAMPLECODE" 只是用于演示调用形式的占位符——它不是真实优惠券。除非你在本轮
  确实调用了工具并复述其真实结果，否则绝不向用户说出任何优惠券码、优惠金额或促销活动。

  ### optimize_cart(product_ids_with_quantities)
  为购物车寻找最优价格。传入 [{"product_id": "uuid", "quantity": 1}, ...]。
  -> 返回：{"original_total": 500.00, "best_coupon": "<code from the tool result>", "coupon_discount": 75.00, "loyalty_discount": 50.00, "final_total": 375.00}

  ### get_active_deals()
  列出当前全部促销活动与未过期优惠券。
  -> 返回：{"coupons": [...], "promotions": [...]}——该列表随时间变化；回答「现在有哪些
  优惠」这类问题时，绝不能凭对以往调用的记忆或凭这些示例作答，必须每次实时调用。

  ### check_bundle_eligibility(product_ids)
  判断商品是否符合组合购 / 满件优惠条件。

  ### get_loyalty_tier()
  当前用户的会员等级与权益。无需参数。
  -> 返回：{"tier": "gold", "discount_pct": 10, "free_shipping_threshold": 0, "priority_support": true}

  ### calculate_loyalty_discount(cart_total)
  按会员等级计算购物车金额对应的折扣。
  -> 返回：{"tier": "gold", "discount_pct": 10, "discount_amount": 50.00, "free_shipping": true}

review_tools: |
  ## 工具使用指南

  ### get_product_reviews(product_id, sort_by?, limit?, offset?)
  分页获取评论。sort_by 取值：newest, helpful, rating_high, rating_low。
  -> 返回：{"reviews": [{"rating": 5, "title": "非常好用！", "body": "...", "verified": true, "reviewer": "张伟", "date": "..."}], "total": 45}

  ### analyze_sentiment(product_id)
  针对某商品的汇总情感分析。
  -> 返回：{"avg_rating": 4.5, "total_reviews": 45, "distribution": {"5": 20, "4": 15, "3": 5, "2": 3, "1": 2}, "sentiment": "very_positive", "pros": ["续航出色", "佩戴舒适"], "cons": ["偏重", "价格偏高"]}

  ### get_sentiment_by_topic(product_id)
  按主题拆分：质量、性价比、物流、设计、耐用性。
  -> 返回：{"topics": [{"topic": "quality", "mentions": 30, "avg_rating": 4.8}, {"topic": "value", "mentions": 20, "avg_rating": 3.9}]}

  ### get_sentiment_trend(product_id, months?)
  按月情感趋势。返回：{"months": [{"month": "2026-01", "avg_rating": 4.2, "count": 12}, ...], "direction": "improving"}

  ### detect_fake_reviews(product_id)
  找出可疑评论。返回：{"suspicious_count": 3, "total_reviews": 45, "flagged": [...], "risk_level": "low"}

  ### search_reviews(product_id, keyword)
  在评论正文中检索关键词。

  ### draft_seller_response(review_id)
  为一条评论生成专业的回复模板。

  ### compare_product_reviews(product_ids)
  对比 2-3 件商品的评论情感。

inventory_tools: |
  ## 工具使用指南

  ### check_stock(product_id)
  全部仓库的库存。无需用户上下文。
  -> 返回：{"in_stock": true, "total_quantity": 150, "warehouses": [{"warehouse": "East Coast", "region": "east", "quantity": 80, "low_stock": false}]}

  ### get_warehouse_availability(product_id)
  含补货信息的详细可售情况。
  -> 返回：{"warehouses": [...], "upcoming_restocks": [{"warehouse": "West", "expected_quantity": 50, "expected_date": "2026-04-15"}]}

  ### get_restock_schedule(product_id)
  缺货商品预计何时补货。
  -> 返回：[{"warehouse": "East", "expected_quantity": 50, "expected_date": "2026-04-15"}]

  ### estimate_shipping(product_id, destination_region)
  配送方式与费用。destination_region 取值：east、central 或 west。
  -> 返回：{"options": [{"carrier": "Standard", "price": 5.99, "days": "5-7"}, {"carrier": "Express", "price": 14.99, "days": "2-3"}]}

  ### compare_carriers(region_from, region_to)
  对比某条线路上全部承运商。

  ### get_tracking_status(order_id)
  查询指定订单的物流（按用户限定范围）。

  ### calculate_fulfillment_plan(product_ids, destination_region)
  为多商品订单计算最优仓库发货方案。

  ### place_backorder(product_id, quantity)
  为缺货商品创建预订。
