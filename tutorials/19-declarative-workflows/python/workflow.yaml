# 一份在运行时加载的最小声明式工作流规格。
# 与第 09 章相同的三执行器流水线，但改为数据驱动。

name: text-pipeline
start: uppercase
executors:
  - id: uppercase
    op: upper        # 内置算子：upper、lower、strip、reverse
  - id: validate
    op: non_empty    # 输入为空白时产出一个最终输出
  - id: log
    op: prefix
    prefix: "已记录："
edges:
  - from: uppercase
    to: validate
  - from: validate
    to: log
