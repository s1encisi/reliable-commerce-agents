# 站点配置：https://s1encisi.github.io/reliable-commerce-agents/
#
# 注意：实际发布的站点并不是这个目录。`scripts/build_docs_site.py`
# 会从 docs/、docs/concepts/ 与 tutorials/ 组装出 `_site_src/`，CI 工作流构建的是
# 后者。本文件被原样复制过去作为它的配置。仓库源码树中刻意不含 Jekyll front
# matter，这正是关键所在：同一个文件在 GitHub 上阅读时，front matter 会渲染成
# 一张元数据表，而这里每个页面本身已经用 H1 承载了标题。

title: 可靠电商多智能体平台
description: 可靠电商多智能体平台：基于微软智能体框架，包含核心概念、34 章教程与 Python 参考实现。
remote_theme: just-the-docs/just-the-docs

# `url` 只放站点源（origin），项目路径放在 `baseurl` 里。
# 把路径写进 `url` 会让它重复拼接进所有绝对地址：jekyll-seo-tag 的 canonical、
# og:url，以及 jekyll-sitemap 输出的每一个 <loc>。此前全部 85 条站点地图链接都变成
# /reliable-commerce-agents/reliable-commerce-agents/... 并返回 404，使得下面新增的
# 站点地图比没有还糟。
#
# 显式设置 `baseurl` 的理由与下面的 `repository` 相同：在 CI 中由
# actions/configure-pages 注入，但生成器会把所有内部链接重写为 `{{ site.baseurl }}/...`，
# 因此本地构建若不设置它，产出的站点所有链接都会指向域名根。
url: https://s1encisi.github.io
baseurl: /reliable-commerce-agents

# 显式设置，以便站点可以在本地构建。在 CI 中由 `actions/configure-pages` 注入；
# 缺少它时 jekyll-github-metadata 会以
# `"" is invalid as a repository identifier` 中止 —— 这是一种相当难懂的
# 「你不在 Actions 环境里运行」提示。
repository: s1encisi/reliable-commerce-agents

# Mermaid。本项目有 71 张图（docs/ 下 37 张，教程中 34 张），因此一旦配置错误，
# 这些文档最具辨识度的部分就会静默变成 71 个原始代码块。在这里锁定版本号，
# 才能让 ```mermaid 围栏代码块渲染出来 —— 无需逐页添加 front matter。
# 固定版本而非浮动：Mermaid 的大版本升级可能在无人察觉的情况下改变图语法。
mermaid:
  version: "10.9.1"

# 搜索
search_enabled: true
search_tokenizer_separator: /[\s/]+/
search:
  # 各章篇幅长、子标题多，因此索引到 h3 并展示若干条预览 ——
  # 只有结果里标明命中的是第几章的哪一节，「checkpoint」这类命中词才有用。
  heading_level: 3
  previews: 3

# 右上角导航的附加链接
# 出现在每个页面右上角。「立即运行」刻意放在第一位：大多数人打开这些文档，
# 最常见的目的是把东西跑起来，把它藏在一次点击之后，就决定了读者是试一试还是放弃。
aux_links:
  "立即运行":
    - "/reliable-commerce-agents/getting-started/quick-start.html"
  "在 GitHub 上查看":
    - "//github.com/s1encisi/reliable-commerce-agents"

# 全站页脚。页脚而非仅放在 aux_links 中，是因为页脚在**每个**页面都会渲染，
# 而 aux_links 看起来像界面装饰，容易被忽略。
# 允许使用原始 HTML：主题对该字段做插值时不转义（已对照线上输出验证 ——
# `&copy;` 以实体形式抵达，而非 `&amp;copy;`）。
footer_content: '&copy; 2026 <a href="https://s1encisi.github.io/">aria</a> &middot; MIT 许可证 &middot; <a href="https://github.com/s1encisi" title="GitHub 主页" aria-label="GitHub 主页"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true" style="vertical-align:text-bottom"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z"/></svg></a>'

color_scheme: light
heading_anchors: true

callouts_level: quiet
callouts:
  highlight:
    color: yellow
  important:
    color: blue
  new:
    color: green
  note:
    color: purple
  warning:
    color: red

kramdown:
  syntax_highlighter_opts:
    block:
      line_numbers: false

# 「在 GitHub 上编辑此页」刻意关闭。本站是生成出来的，主题的编辑链接会指向仓库中
# 并不存在的路径。取而代之，每个页面都带有一行由 build_docs_site.py 生成的
# 「查看源码」，指向真实文件。
gh_edit_link: false

# 两者都位于 s1encisi.github.io 下，因此属于同域内部链接 ——
# 它们携带真实的排名信号，而不只是导航。第一个条目刻意不在此处重复列出，
# 避免同一 URL 被列两次。
nav_external_links:
  - title: 在 GitHub 上查看可靠电商多智能体平台
    url: https://github.com/s1encisi/reliable-commerce-agents
    hide_icon: false

back_to_top: true
back_to_top_text: "回到顶部"

collapse_inactive_chapters: true
enable_copy_code_button: true

# 与 s1encisi.github.io 使用同一个 Google Analytics 属性。
#
# 此前该键缺失，而 ga_tracking_anonymize_ip 已经设置，just-the-docs 只在
# `{% if site.ga_tracking != nil %}` 时输出 gtag 代码块，
# 因此站点看起来已配置，实际却什么都没采集。
ga_tracking: G-5Z8HS51RCP
ga_tracking_anonymize_ip: true

# 默认社交预览图。jekyll-seo-tag 据此输出 og:image 与
# twitter:image，并把卡片从缩略图升级为横幅 —— 因此链接分享到微信、钉钉或 X 时
# 展示的是智能体时间线，而不是一个灰色空框。
#
# 这里必须通过 `defaults` 设置，不能写成顶层的 `image:` 键。起初写成顶层键，
# 结果静默失效：全部 85 个页面依然没有 og:image。jekyll-seo-tag 的 ImageDrop
# 读取的是 `page["image"]`，没有 `site["image"]` 兜底，因此站点级键永远不会被读取。
# `defaults` 才能把该值注入每个页面的 front matter，而那正是 ImageDrop 实际读取的位置。
#
# 必须是绝对 URL。jekyll-seo-tag 不会给根相对路径的图片补上 `baseurl`，
# 因此写成 `/docs/images/...` 会以域名根解析并 404 —— 与修复前导致每条站点地图
# 链接出错的是同一个「丢掉或重复」陷阱。`docs/` 这一段是真实存在的：
# build_docs_site.py 会把 docs/images 复制到 _site_src/docs/images，保留该前缀。
defaults:
  - scope:
      path: ""
    values:
      image: https://s1encisi.github.io/reliable-commerce-agents/docs/images/agent-timeline.png

twitter:
  card: summary_large_image

# 站点此前完全没有 sitemap.xml，导致全部 85 个生成页面无法被发现 ——
# Search Console 无可提交，爬虫也无从遍历。jekyll-sitemap 在白名单内的 GitHub Pages
# 插件中，因此它能在 actions/jekyll-build-pages 下无需 Gemfile 直接运行。
plugins:
  - jekyll-sitemap
