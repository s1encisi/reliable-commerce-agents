# ============================================================
# 可靠电商多智能体平台 — 演示栈（拉取预构建镜像）
#
#   cp .env.minimal .env       然后设置 OPENAI_API_KEY
#   docker compose -f docker-compose.demo.yml up
#
# 随后打开 http://localhost:3000，使用
# alice.johnson@gmail.com / customer123 登录。
#
# ── 与 docker-compose.yml 的区别 ────────────────────────────────────────────
#
# 1. 所有应用服务使用 GHCR 上的 `image:`，而非本地 `build:`。
#    无需本地编译，首次运行是拉取镜像而非构建十个镜像。
# 2. 核心链路上不设 profile。docker-compose.yml 把服务放在
#    agents / frontend / seed profile 之后，这适合开发，但不适合演示 ——
#    本文件让首次访问者一条命令、零参数即可启动全部所需服务。
#    两个 MCP 服务仍保留 `mcp` profile，因为 MCP_ENABLED 默认为 false，
#    启动它们只会多出两个无人调用的容器。
# 3. 种子数据的执行顺序显式声明。所有读取数据库的服务都等待其完成，
#    而不是依赖 dev.sh 的调度顺序。
#
# ── 你会拿到哪个镜像 ────────────────────────────────────────────────────────
#
#   :latest  （默认）  最新的正式发布版 —— 通过完整测试套件并经过人工批准，
#                      首次访问者应当使用这一版。
#   :main               main 分支最新提交，测试通过但尚未发布
#   :v1.1.0             指定的某个发布版本
#
# 无需修改本文件即可覆盖：
#
#   IMAGE_TAG=main docker compose -f docker-compose.demo.yml up
#
# 从源码构建的贡献者请使用 docker-compose.yml 与 ./scripts/dev.sh。
# 镜像标签策略见 docs/releasing.md，.env 如何传入容器见 docs/configuration.md。
# ============================================================

# Compose 项目名，显式指定。
#
# 若不指定，本目录下的每个 compose 文件都会解析为同一个项目（取目录名），
# 导致不同环境共用容器名，`docker compose down` 只关掉其中一组、另一组变成
# 孤儿容器残留。显式命名后，各环境互相独立、可单独寻址。
name: reliable-commerce-agents-demo

x-image-tag: &image-tag ${IMAGE_TAG:-latest}

services:
  # ── Infrastructure (public images, unchanged from docker-compose.yml) ──────

  db:
    image: pgvector/pgvector:pg16
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: ecommerce_agents
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ecommerce -d ecommerce_agents"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Jaeger（OpenTelemetry 追踪可视化）──────────────────────────────────────

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports:
      - "16686:16686" # Jaeger 查询界面
      - "4317:4317"   # OTLP gRPC 接收端
      - "4318:4318"   # OTLP HTTP 接收端
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  # ── Seed (runs once, exits) ───────────────────────────────────────────────
  #
  # Runs from the orchestrator image -- it is the same Python environment, and
  # scripts/ is mounted from the clone rather than baked in.
  #
  # Everything that reads the database waits on this. Order matters beyond
  # "the tables exist": the IVFFlat index has to be built against a populated
  # table. Created on an empty one it has no centroids and semantic search
  # returns unrelated products at similarity 0.000 -- a real production bug
  # this repo already hit once.
  seeder:
    image: ghcr.io/s1encisi/reliable-commerce-agents/orchestrator:${IMAGE_TAG:-latest}
    working_dir: /app
    command: uv run --no-project python -m scripts.seed
    volumes:
      - ./scripts:/app/scripts:ro
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ecommerce:ecommerce_secret@db:5432/ecommerce_agents
      OAUTH_SEED_KEY: ${OAUTH_SEED_KEY:-dev-oauth-seed-change-me}
    restart: "no"

  # ── OAuth2 Authorization Server ───────────────────────────────────────────
  #
  # Idle unless AUTH_MODE=oauth. Started anyway so flipping that one variable
  # works without also learning which profile to add.
  auth-server:
    image: ghcr.io/s1encisi/reliable-commerce-agents/auth-server:${IMAGE_TAG:-latest}
    ports: ["8090:8090"]
    depends_on:
      db: { condition: service_healthy }
      seeder: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgresql://ecommerce:ecommerce_secret@db:5432/ecommerce_agents
      AUTH_SERVER_ISSUER: http://auth-server:8090
      AUTH_RSA_KEY_SIZE: ${AUTH_RSA_KEY_SIZE:-2048}
      AUTH_SIGNING_KEY_ENCRYPTION_KEY: ${AUTH_SIGNING_KEY_ENCRYPTION_KEY:-}
      AUTH_ACCESS_TOKEN_TTL: ${AUTH_ACCESS_TOKEN_TTL:-3600}
      AUTH_REFRESH_TOKEN_TTL: ${AUTH_REFRESH_TOKEN_TTL:-604800}
      OAUTH_SEED_KEY: ${OAUTH_SEED_KEY:-dev-oauth-seed-change-me}
      AUTH_SERVER_AUDIENCE: ${AUTH_SERVER_AUDIENCE:-ecommerce-auth-server}
      AUTH_ALLOW_DYNAMIC_REGISTRATION: ${AUTH_ALLOW_DYNAMIC_REGISTRATION:-false}
      ENVIRONMENT: ${ENVIRONMENT:-development}

  # ── Orchestrator ──────────────────────────────────────────────────────────

  orchestrator:
    image: ghcr.io/s1encisi/reliable-commerce-agents/orchestrator:${IMAGE_TAG:-latest}
    ports: ["8080:8080"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      seeder: { condition: service_completed_successfully }

    environment: &agent-env
      DATABASE_URL: postgresql://ecommerce:ecommerce_secret@db:5432/ecommerce_agents
      REDIS_URL: redis://redis:6379
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4.1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_KEY: ${AZURE_OPENAI_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2025-03-01-preview}
      AZURE_EMBEDDING_DEPLOYMENT: ${AZURE_EMBEDDING_DEPLOYMENT:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-random-256-bit-key}
      AGENT_SHARED_SECRET: ${AGENT_SHARED_SECRET:-agent-internal-shared-secret}
      AUTH_MODE: ${AUTH_MODE:-local}
      AUTH_SERVER_ISSUER: http://auth-server:8090
      AUTH_SERVER_JWKS_URL: http://auth-server:8090/.well-known/jwks.json
      AUTH_SERVER_TOKEN_URL: http://auth-server:8090/oauth/token
      AUTH_JWKS_CACHE_TTL: ${AUTH_JWKS_CACHE_TTL:-900}
      AUTH_ORCH_AUDIENCE: ${AUTH_ORCH_AUDIENCE:-ecommerce-orchestrator}
      AUTH_AGENT_AUDIENCE: ${AUTH_AGENT_AUDIENCE:-ecommerce-agents}
      OAUTH_CLIENT_ID: orchestrator
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-}
      OAUTH_SEED_KEY: ${OAUTH_SEED_KEY:-dev-oauth-seed-change-me}
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: ecommerce.orchestrator
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: ${OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT:-true}
      MAF_SESSION_BACKEND: ${MAF_SESSION_BACKEND:-postgres}
      MAF_CHECKPOINT_BACKEND: ${MAF_CHECKPOINT_BACKEND:-postgres}
      ORCHESTRATION_MODE: ${ORCHESTRATION_MODE:-tool}
      RETURN_HITL_THRESHOLD: ${RETURN_HITL_THRESHOLD:-500}
      HANDOFF_AUTONOMOUS_MODE: ${HANDOFF_AUTONOMOUS_MODE:-true}
      AGENT_REGISTRY: >-
        {
          "product-discovery": "http://product-discovery:8081",
          "order-management": "http://order-management:8082",
          "pricing-promotions": "http://pricing-promotions:8083",
          "review-sentiment": "http://review-sentiment:8084",
          "inventory-fulfillment": "http://inventory-fulfillment:8085"
        }

  # ── Specialist agents ─────────────────────────────────────────────────────

  product-discovery:
    image: ghcr.io/s1encisi/reliable-commerce-agents/product-discovery:${IMAGE_TAG:-latest}
    ports: ["8081:8081"]
    depends_on:
      db: { condition: service_healthy }
      seeder: { condition: service_completed_successfully }
    environment:
      <<: *agent-env
      OTEL_SERVICE_NAME: ecommerce.product-discovery
      OAUTH_CLIENT_ID: product-discovery
      MCP_ENABLED: ${MCP_ENABLED:-false}
      MCP_AUTH_ENABLED: ${MCP_AUTH_ENABLED:-false}
      MCP_PRODUCT_SERVER_URL: http://mcp-product:9000/mcp
      MCP_PRODUCT_AUDIENCE: ${MCP_PRODUCT_AUDIENCE:-mcp-product}
      MCP_PRODUCT_REQUIRED_SCOPE: ${MCP_PRODUCT_REQUIRED_SCOPE:-mcp:product}

  order-management:
    image: ghcr.io/s1encisi/reliable-commerce-agents/order-management:${IMAGE_TAG:-latest}
    ports: ["8082:8082"]
    depends_on:
      db: { condition: service_healthy }
      seeder: { condition: service_completed_successfully }
    environment:
      <<: *agent-env
      OTEL_SERVICE_NAME: ecommerce.order-management
      OAUTH_CLIENT_ID: order-management

  pricing-promotions:
    image: ghcr.io/s1encisi/reliable-commerce-agents/pricing-promotions:${IMAGE_TAG:-latest}
    ports: ["8083:8083"]
    depends_on:
      db: { condition: service_healthy }
      seeder: { condition: service_completed_successfully }
    environment:
      <<: *agent-env
      OTEL_SERVICE_NAME: ecommerce.pricing-promotions
      OAUTH_CLIENT_ID: pricing-promotions

  review-sentiment:
    image: ghcr.io/s1encisi/reliable-commerce-agents/review-sentiment:${IMAGE_TAG:-latest}
    ports: ["8084:8084"]
    depends_on:
      db: { condition: service_healthy }
      seeder: { condition: service_completed_successfully }
    environment:
      <<: *agent-env
      OTEL_SERVICE_NAME: ecommerce.review-sentiment
      OAUTH_CLIENT_ID: review-sentiment

  inventory-fulfillment:
    image: ghcr.io/s1encisi/reliable-commerce-agents/inventory-fulfillment:${IMAGE_TAG:-latest}
    ports: ["8085:8085"]
    depends_on:
      db: { condition: service_healthy }
      seeder: { condition: service_completed_successfully }
    environment:
      <<: *agent-env
      OTEL_SERVICE_NAME: ecommerce.inventory-fulfillment
      OAUTH_CLIENT_ID: inventory-fulfillment
      MCP_ENABLED: ${MCP_ENABLED:-false}
      MCP_AUTH_ENABLED: ${MCP_AUTH_ENABLED:-false}
      MCP_INVENTORY_SERVER_URL: http://mcp-inventory:9001/mcp
      MCP_INVENTORY_AUDIENCE: ${MCP_INVENTORY_AUDIENCE:-mcp-inventory}
      MCP_INVENTORY_REQUIRED_SCOPE: ${MCP_INVENTORY_REQUIRED_SCOPE:-mcp:inventory}

  # ── MCP servers (opt-in) ──────────────────────────────────────────────────
  #
  # Kept behind a profile because MCP_ENABLED is false by default, so on the
  # default path these would be two containers nothing talks to. To use them:
  #
  #   MCP_ENABLED=true docker compose -f docker-compose.demo.yml --profile mcp up

  mcp-product:
    image: ghcr.io/s1encisi/reliable-commerce-agents/mcp-product:${IMAGE_TAG:-latest}
    ports: ["9000:9000"]
    depends_on:
      db: { condition: service_healthy }
      seeder: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgresql://ecommerce:ecommerce_secret@db:5432/ecommerce_agents
      MCP_AUTH_ENABLED: ${MCP_AUTH_ENABLED:-false}
      AUTH_SERVER_ISSUER: http://auth-server:8090
      AUTH_SERVER_JWKS_URL: http://auth-server:8090/.well-known/jwks.json
      MCP_PRODUCT_AUDIENCE: ${MCP_PRODUCT_AUDIENCE:-mcp-product}
      MCP_PRODUCT_REQUIRED_SCOPE: ${MCP_PRODUCT_REQUIRED_SCOPE:-mcp:product}
      MCP_PRODUCT_RESOURCE_URL: http://localhost:9000/mcp
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ \"$$MCP_AUTH_ENABLED\" = \"true\" ]; then curl -sf http://localhost:9000/.well-known/oauth-protected-resource/mcp; else curl -sf http://localhost:9000/mcp; fi",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    profiles: ["mcp"]

  mcp-inventory:
    image: ghcr.io/s1encisi/reliable-commerce-agents/mcp-inventory:${IMAGE_TAG:-latest}
    ports: ["9001:9001"]
    depends_on:
      db: { condition: service_healthy }
      seeder: { condition: service_completed_successfully }
    environment:
      DATABASE_URL: postgresql://ecommerce:ecommerce_secret@db:5432/ecommerce_agents
      MCP_AUTH_ENABLED: ${MCP_AUTH_ENABLED:-false}
      AUTH_SERVER_ISSUER: http://auth-server:8090
      AUTH_SERVER_JWKS_URL: http://auth-server:8090/.well-known/jwks.json
      MCP_INVENTORY_AUDIENCE: ${MCP_INVENTORY_AUDIENCE:-mcp-inventory}
      MCP_INVENTORY_REQUIRED_SCOPE: ${MCP_INVENTORY_REQUIRED_SCOPE:-mcp:inventory}
      MCP_INVENTORY_RESOURCE_URL: http://localhost:9001/mcp
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ \"$$MCP_AUTH_ENABLED\" = \"true\" ]; then curl -sf http://localhost:9001/.well-known/oauth-protected-resource/mcp; else curl -sf http://localhost:9001/mcp; fi",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    profiles: ["mcp"]

  # ── Frontend ──────────────────────────────────────────────────────────────
  #
  # The published image is not built against any backend: the browser calls
  # the frontend's own origin and Next forwards /api/* to ORCHESTRATOR_URL at
  # runtime. The same image runs here and on Container Apps -- only this
  # variable changes. See docs/configuration.md.
  frontend:
    image: ghcr.io/s1encisi/reliable-commerce-agents/frontend:${IMAGE_TAG:-latest}
    ports: ["3000:3000"]
    environment:
      ORCHESTRATOR_URL: http://orchestrator:8080
    depends_on:
      orchestrator: { condition: service_started }

volumes:
  pgdata:
