name: 功能建议
description: 提议本项目应该做的事
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 它解决了什么问题？
      description: 描述你遇到的情况，而不是你心里的那个方案。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 你希望看到什么？
    validations:
      required: true

  - type: checkboxes
    id: stacks
    attributes:
      label: 需要落到哪些层次？
      options:
        - label: Python 后端
        - label: 前端
        - label: 仅文档或教程

  - type: textarea
    id: alternatives
    attributes:
      label: 有没有你已考虑并否掉的方案？
      description: 可选，但被否掉的选项往往是最有用的部分。
