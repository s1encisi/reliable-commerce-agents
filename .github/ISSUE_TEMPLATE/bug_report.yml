name: 缺陷报告
description: 某些东西没有按文档描述的方式工作
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        针对本仓库的大多数报告，最终都取决于**哪个模型提供方**以及**如何启动** ——
        所以这两个问题设为必填。提前回答它们，通常就是「一次回复」与「来回四次」的区别。

  - type: dropdown
    id: howrun
    attributes:
      label: 你是如何启动它的？
      options:
        - ./scripts/dev.sh --demo（从 GHCR 拉取预构建镜像）
        - ./scripts/dev.sh（从源码构建）
        - ./scripts/dev.ps1（Windows）
        - 直接使用 docker compose
        - 在 Docker 之外运行某个服务
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: 使用哪个模型提供方？
      description: 一个无法可靠调用工具的本地模型，是「智能体胡编乱造」最常见的原因。
      options:
        - OpenAI
        - Azure OpenAI
        - Ollama 或其他 OpenAI 兼容端点（LLM_BASE_URL）
        - LLM_PROVIDER=replay（已录制的 fixture）
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 你期望什么，实际发生了什么？
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      placeholder: |
        1. cp .env.minimal .env，设置 OPENAI_API_KEY
        2. ./scripts/dev.sh --demo
        3. 在聊天中问「...」
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 日志
      description: |
        `docker compose logs orchestrator --tail 100`，以及涉及的那个专业智能体。
        粘贴前请先抹掉你的 API key。
      render: shell

  - type: input
    id: version
    attributes:
      label: 版本或提交号
      placeholder: "v1.1.0，或以下命令的输出：git rev-parse --short HEAD"
