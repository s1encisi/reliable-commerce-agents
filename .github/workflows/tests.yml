name: 测试

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # 由 release.yml 调用，使版本标签在发布任何东西之前，先对被打标签的提交重跑整套测试。
  # GitHub Actions 没有跨工作流的 `needs:`，所以 `workflow_call` 是唯一能表达它的方式。
  workflow_call:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-tests:
    name: Python · pytest + 覆盖率
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: 安装 Python 3.12
        run: uv python install 3.12

      - name: 同步依赖
        working-directory: agents/python
        # --all-packages 会拉入 uv 工作区成员（ecommerce-mcp-product、
        # ecommerce-mcp-inventory）—— 这是必需的，否则
        # tests/test_mcp_oauth_integration.py 无法导入它们，
        # 收集阶段就会以 ModuleNotFoundError 失败。
        run: uv sync --all-packages --extra dev

      - name: 运行 pytest 并统计覆盖率
        working-directory: agents/python
        run: |
          uv run pytest \
            --cov \
            --cov-config=.coveragerc.ci \
            --cov-report=xml \
            --cov-report=term-missing \
            --cov-fail-under=70

      - name: 上传覆盖率产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: python-coverage
          path: agents/python/coverage.xml
          retention-days: 30

  mcp-package-tests:
    name: MCP 包 · 冒烟测试
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 只做注册/导入冒烟测试 —— 不需要 testcontainers 的 Postgres。
    # 标记为 integration 的测试在这里被跳过（`-m "not integration"`）。它们目前
    # 不被任何其他定时任务运行 —— evals.yml 仅支持 workflow_dispatch，且只运行
    # `evals.run_evals` 而非 pytest，因此从不触及这些包的集成测试。
    # 一道能覆盖此处的、阻断 PR 的冒烟门禁已有规划，但尚未实现。
    strategy:
      matrix:
        package:
          - { name: ecommerce-mcp-product, dir: packages/mcp-product }
          - { name: ecommerce-mcp-inventory, dir: packages/mcp-inventory }
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: 安装 Python 3.12
        run: uv python install 3.12

      - name: 同步包依赖
        working-directory: agents/python
        run: uv sync --frozen --all-packages --extra dev

      - name: 运行冒烟测试（跳过集成测试）
        working-directory: agents/python
        run: uv run pytest ${{ matrix.package.dir }}/tests -m "not integration" -v

  web-tests:
    name: Web · 类型检查 + 代码检查 + 测试 + 构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: 配置 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: 安装依赖
        # pnpm-workspace.yaml 中已提交的 allowBuilds 显式拒绝了 msw/sharp/
        # unrs-resolver 的 postinstall 脚本（见 #7）—— 没有它，全新安装会撞上
        # pnpm 的交互式构建审批门禁，在非交互的 CI shell 中直接失败。
        run: pnpm install --frozen-lockfile

      - name: 类型检查
        run: pnpm exec tsc --noEmit

      - name: 代码检查
        run: pnpm lint

      - name: 单元 / 组件测试
        run: pnpm test

      - name: 构建
        run: pnpm build

  # Playwright E2E 被刻意排除在 CI 之外。它需要完整的实时环境
  # （docker compose：Postgres + Redis + 全部智能体）以及真实的
  # OPENAI_API_KEY（LLM 从不被 mock），对每次推送而言既不现实也太贵。
  # 这些 spec 仍保留在 web/e2e/ 下 —— 对着运行中的应用在本地运行它们：
  # cd web && pnpm exec playwright test

  workflow-visualization-drift:
    name: 工作流图 · 漂移检查
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # 在可视化工作落地 Phase 7 之前，由显式开关控制。
    if: ${{ vars.WORKFLOW_VISUALIZATION_ON_BUILD == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v4

      - name: 同步依赖
        working-directory: agents/python
        run: uv sync --extra dev

      - name: 重新生成图
        working-directory: agents/python
        run: uv run python -m scripts.visualize_workflows

      - name: 存在未提交差异时失败
        run: |
          if ! git diff --quiet docs/workflows/; then
            echo "::error::工作流图已过期。请重新运行 scripts/visualize_workflows.py 并提交。"
            git diff docs/workflows/
            exit 1
          fi

  # ── 仅在整套测试全绿之后发布滚动镜像 ─────────────────────────────────────
  #
  # 这就是那道门禁。build-images.yml 不再自行决定发布任何东西；它暴露
  # `workflow_call`，而由这个 job 在对上面每个测试 job 加 `needs:` 之后授予发布权。
  #
  # 刻意不放进 `needs` 的：
  #   workflow-visualization-drift  — 受 vars.WORKFLOW_VISUALIZATION_ON_BUILD 控制，
  #     所以大多数运行里它会被跳过，而一个被跳过的依赖也会跳过本 job。
  #   evals.yml / tutorials.yml     — 它们为 pull request 把关，而非为镜像。教程 CI
  #     与这些镜像的内容无关，把它们耦合起来意味着一个坏掉的教程章节会挡住安全修复的发布。
  publish-main:
    name: 发布 :main 镜像
    needs: [python-tests, mcp-package-tests, web-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-images.yml
    with:
      publish: true
      tag_mode: main
    secrets: inherit
