name: 发布

# 切一个发布版本。由推送 semver 标签触发。
#
#   git tag v1.1.0 && git push origin v1.1.0
#
# 五个 job，按顺序执行。顺序本身就是重点：
#
#   gate           对被打标签的提交重跑**完整**测试套件。在本工作流出现之前，
#                  标签路径根本不跑测试 —— build-images.yml 在标签上推送且对任何
#                  东西都没有 `needs:`，因此打在一个红色提交上的标签会发布镜像。
#   version-check  标签与 agents/python/pyproject.toml 必须一致。正是它阻止了那种漂移：
#                  仓库一度是 pyproject 写 0.1.0、唯一的标签写 v1.0.0、README 写 v1.1。
#   approve        阻塞在 `release` GitHub 环境的必需审批人上。你先看到门禁结果，再点确认。
#   publish        构建并推送 :vX.Y.Z（正式发布时附带 :latest）。
#   release        创建 GitHub release，说明从 CHANGELOG.md 中读出。
#
# 需要额外配置，否则它会静默失效：`release` 环境必须存在且配置了必需审批人。
# 如果它不存在，`environment:` 就是个空操作，审批门禁并不存在，发布会自动进行，
# 既不报错，也没有任何迹象表明少了什么。
#
# 见 docs/releasing.md。

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # 绝不在发布中途取消

jobs:
  # ── 1. 对被打标签的提交重跑完整测试套件 ───────────────────────────────────
  gate:
    name: 门禁
    # 被调用的工作流不能请求超过调用方授予的权限，而失败形态是 `startup_failure`，
    # 既没有日志也没有注解 —— 什么都指不到权限上。tests.yml 声明了
    # `pull-requests: write`（它的覆盖率评论步骤），超过了本工作流顶层的
    # `contents: read`，所以门禁在这里至少要授予那个超集。
    #
    # 包含 `packages: write` 是因为 tests.yml 自己的 publish-main job 会调用
    # build-images.yml。该 job 在标签上会被跳过（它以推送到 main 为条件），
    # 但权限集在启动时就会校验，与该 job 最终是否运行无关。
    permissions:
      contents: read
      pull-requests: write
      packages: write
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  # ── 2. 标签与已提交的版本必须一致 ────────────────────────────────────────
  version-check:
    name: 版本校验
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 标签必须与 pyproject.toml 一致
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          FILE_VERSION=$(grep -m1 '^version = ' agents/python/pyproject.toml | sed 's/version = "\(.*\)"/\1/')

          echo "tag:        ${TAG}"
          echo "pyproject:  ${FILE_VERSION}"

          if [[ "$TAG" != "$FILE_VERSION" ]]; then
            echo "::error::标签 ${GITHUB_REF_NAME} 与 pyproject.toml 的版本 ${FILE_VERSION} 不一致。"
            echo "::error::请运行 'python scripts/bump_version.py ${TAG}'，提交，然后重新打标签。"
            exit 1
          fi

      - name: CHANGELOG 必须包含该版本的章节
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          if ! grep -q "^## \[${TAG}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md 中没有 '## [${TAG}]' 章节。"
            echo "::error::发布不得带空说明发出。"
            exit 1
          fi

  # ── 3. 人工审批 ──────────────────────────────────────────────────────────
  approve:
    name: 审批发布
    needs: [gate, version-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release
    steps:
      - name: 已批准
        run: echo "Release ${GITHUB_REF_NAME} approved — publishing images."

  # ── 4. 构建并推送带版本号的镜像 ──────────────────────────────────────────
  publish:
    name: 发布镜像
    needs: approve
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-images.yml
    with:
      publish: true
      tag_mode: release
      version: ${{ github.ref_name }}
    secrets: inherit

  # ── 5. GitHub release 本身 ───────────────────────────────────────────────
  release:
    name: 创建 GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # 只从 CHANGELOG.md 中抽出本版本的章节：本版本标题到下一个标题之间的全部内容。
      # 精心撰写的说明胜过 --generate-notes：本仓库的笔调是它的差异点，
      # 而自动生成的提交倾倒会把它丢掉。
      - name: 从 CHANGELOG.md 提取发布说明
        id: notes
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          awk -v ver="$TAG" '
            $0 ~ "^## \\[" ver "\\]" { collecting = 1; next }
            collecting && /^## \[/    { exit }
            collecting                { print }
          ' CHANGELOG.md > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            echo "::error::为 ${TAG} 提取到的发布说明为空"
            exit 1
          fi

          echo "--- notes ---"
          cat release-notes.md

      - name: 创建 release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE=""
          if [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            PRERELEASE="--prerelease"
          fi

          gh release create "${GITHUB_REF_NAME}" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md \
            $PRERELEASE
