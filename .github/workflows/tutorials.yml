name: 教程

# 让 tutorials/ 各章节保持诚实：每个 README 都记录
#   uv sync --project tutorials
#   uv run --project tutorials python tutorials/<chapter>/python/main.py
#   uv run --project tutorials pytest tutorials/<chapter>/python/tests -v
# 而本工作流在每次推送与 PR 上运行 `pytest -m "not integration"`，
# 因此某个章节不可能在 CI 不变红的情况下悄悄停止被收集或开始失败。
#
# 21 个教程测试文件中有 14 个被标记为 `@pytest.mark.integration`，需要真实的
# OPENAI_API_KEY / AZURE_OPENAI_* 密钥才能运行 —— 本 job 刻意不提供密钥，因此那些
# 具体测试在这里被收集但跳过/取消选中，而不是删除或去掉标记。这 14 个章节每一个
# 都另外附带一个无需密钥、基于回放的测试（未加标记，因此确实被 "not integration"
# 覆盖），它通过 `LLM_PROVIDER=replay` 回放已提交的 fixture —— 参考实现见
# tutorials/_shared/replay_client.py 与 tutorials/01-first-agent/。正是它让本 job
# 在零密钥配置的情况下，于每个 PR 上验证「命中 LLM 并拿到真实答案」这条断言。
#
# PYTHONHASHSEED 被固定，是因为第 14 章的 HandoffBuilder 网状结构构建对 Python
# 每进程的哈希随机化敏感，而它会改变后续交接轮次中构建出的内容，进而改变那些轮次
# 的回放 fixture 哈希（见
# tutorials/14-handoff-orchestration/python/tests/test_handoff.py 的模块 docstring）。
# fixture 是在 PYTHONHASHSEED=0 下录制的；若这里不做同样的固定，该章节的回放测试
# 就会变得不稳定。其他章节不需要它 —— 它们的参与者列表按列表顺序消费，
# 不经过任何对哈希顺序敏感的东西。
#
# 第 20b 章（DevUI）自带 pyproject.toml，第 22 章（群聊辩论）从 agents/python 导入
# 生产模块 workflows.group_chat —— 见 tutorials/README.md 的「运行某一章」一节。
# 两者都在这里被覆盖：20b 的测试会被收集，因为 agent-framework-devui 也是
# tutorials/pyproject.toml 的依赖；而 22 的测试自己把 agents/python 放进 sys.path，
# 因此它们像其他章节一样在本项目下被收集。
#
# 第 22 章此前没有自己的测试，理由是 agents/python/tests/test_workflow_group_chat.py
# 已覆盖它。但那覆盖的是**模块**，不是章节：该演示自己的参与者、它的综合器，以及
# 章节所依据的核心主张 —— 后发言的参与者能看到先前的轮次 —— 都没有测试，
# 而这个主张从演示的输出中是看不出来的。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tutorials-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tutorials-tests:
    name: 教程 · pytest（非集成）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # 见文件顶部注释 —— 为第 14 章固定可复现的回放。
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: 安装 Python 3.12
        run: uv python install 3.12

      - name: 同步依赖
        working-directory: tutorials
        run: uv sync --frozen --extra dev

      - name: 运行 pytest（仅确定性章节）
        run: uv run --project tutorials pytest tutorials/ -m "not integration"

  tutorials-lint:
    name: 教程 · ruff check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true

      - name: 安装 Python 3.12
        run: uv python install 3.12

      - name: 同步依赖
        working-directory: tutorials
        run: uv sync --frozen --extra dev

      - name: ruff check
        run: uv run --project tutorials ruff check tutorials/

  tutorials-contract:
    name: 教程 · 章节契约
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Phase 4c + 4d 把全部 24 个章节从「仅报告」的启动器桩状态恢复为对每个章节
      # 都真实阻断合并的门禁。
      - name: 章节契约检查
        run: python3 scripts/check_tutorial_readmes.py --check

      # tutorials/README.md 中的语言覆盖表由磁盘上的实际内容生成。它在真正被生成之前
      # 很久就声称自己是生成的，并发生了漂移 —— 把并未移植的章节描述为已移植。
      # 这道检查才让那句声明成真：新增或删除一个测试项目后，表格必须重新生成，
      # 否则构建失败。
      - name: 覆盖表未过期
        run: python3 scripts/check_tutorial_coverage.py --check
