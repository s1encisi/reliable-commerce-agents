name: 包清理

# GHCR 没有内置的保留策略设置，所以这就是保留策略。
#
# 一旦 build-images.yml 开始发布，就有两类东西会无限累积：
#
#   1. `:sha-<7>` 标签 —— main 上每个提交一个，永不停止。
#   2. 未打标签的版本 —— 多架构构建会推送一个 manifest list 以及每个平台一个
#      image manifest。当标签移到更新的构建上时，先前的平台 manifest 就被留成未打标签的。
#      这是数量上更大的来源，而且在包的 UI 里除非专门去找，否则根本看不见。
#
# 永不删除的内容，由下面的 `ignore-versions` 强制：
#   :latest              最新的发布版本，docker-compose.demo.yml 固定使用它
#   :main                main 的滚动最新
#   :vX.Y.Z              每一个发布标签，包括预发布
#
# 每周运行。也可用 dry_run 输入手动触发，第一次用值得先跑 dry run ——
# 该 action 会报告将要删除什么，而不会真的删除。
#
# 见 docs/releasing.md。

on:
  schedule:
    - cron: "0 4 * * 0" # 每周日 04:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只报告将要删除什么，不实际删除"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: package-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    name: 清理 ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      packages: write

    strategy:
      fail-fast: false
      matrix:
        package:
          - orchestrator
          - product-discovery
          - order-management
          - pricing-promotions
          - review-sentiment
          - inventory-fulfillment
          - auth-server
          - mcp-product
          - mcp-inventory
          - frontend

    steps:
      - name: 清理 ${{ matrix.package }} 的旧版本
        uses: actions/delete-package-versions@v5
        with:
          owner: s1encisi
          package-name: reliable-commerce-agents/${{ matrix.package }}
          package-type: container
          # 保留一个宽裕的窗口。二十个版本大约是 main 上一个月左右的提交量，
          # 足以把一次回归二分定位回某个具体的镜像。
          min-versions-to-keep: 20
          # 任何匹配此模式的都永远不是候选，与新旧无关。
          ignore-versions: '^(latest|main|v\d+\.\d+\.\d+.*)$'
          dry-run: ${{ inputs.dry_run || false }}
