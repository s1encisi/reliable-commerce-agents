name: 评测

# 两个 job，按成本划分：
#
# - `smoke` 在每个 PR 上运行：全部数据集（包括 orchestrator_routing.json
#   与 red_team.json），一律在 LLM_PROVIDER=replay 下、只用确定性评分器，
#   并与 evals/baselines/ 比较。零成本、零凭据 —— 录制带是如何录制的、
#   以及为什么在跑编排器/安全套件之前仍需要启动五个专业智能体服务
#   （回放模式下不需要 key），见 agents/python/evals/fixtures/README.md：
#   call_specialist_agent 会发起一次与 LLM_PROVIDER 无关的真实 HTTP 调用，
#   所以这两个套件需要服务**起来**，只是不做任何真实 LLM 调用。
# - `full` 仅在 workflow_dispatch 下运行：用真实 key 与 --use-llm-judge 重跑每个
#   套件，让完整性由评判而非关键词匹配来判定。这是唯一会花掉真实 OpenAI 预算的那个。
#
#   它过去还会按每周 cron 运行。本仓库中不允许任何东西在自动触发器上花费真实 LLM key
#   —— 定时任务会按时间表向你计费，为一个没人要的结果付费，而且（正如 2026-08-24 那次
#   运行所示）它失败时也没人看。任何花钱的东西都由想要答案的人手动启动。
#   在此处新增 job 时请保持这一点。

on:
  pull_request:
    paths:
      - "agents/python/evals/**"
      - "agents/python/shared/**"
      - "agents/python/orchestrator/**"
      - "agents/python/*_discovery/**"
      - "agents/python/*_management/**"
      - "agents/python/*_promotions/**"
      - "agents/python/*_sentiment/**"
      - "agents/python/*_fulfillment/**"
  push:
    branches: [main]
    paths:
      - "agents/python/evals/**"
  workflow_dispatch:
    inputs:
      pass_threshold:
        description: "质量套件的最低总分"
        default: "0.7"

permissions:
  contents: read

env:
  DATABASE_URL: postgresql://ecommerce:ecommerce_secret@localhost:5432/ecommerce_agents
  REDIS_URL: redis://localhost:6379
  # 'test' 让 settings 校验器对占位密钥保持警告模式。
  ENVIRONMENT: test
  JWT_SECRET: ci-eval-jwt-secret-please-rotate-32bytes
  AGENT_SHARED_SECRET: ci-eval-agent-secret-please-rotate-32b
  AGENT_REGISTRY: >-
    {"product-discovery":"http://localhost:8081","order-management":"http://localhost:8082",
    "pricing-promotions":"http://localhost:8083","review-sentiment":"http://localhost:8084",
    "inventory-fulfillment":"http://localhost:8085"}
  THRESH: ${{ github.event.inputs.pass_threshold || '0.7' }}
  # smoke job 回放的是冻结的模型输出，因此它的绝对分数是那次录制会话的属性，
  # 而不是被测 pull request 的属性。一个 PR **能**改变的东西由
  # --baseline/--max-regression 衡量（以及那个总会让运行失败的缺失 fixture 检查）。
  # 0.7 的质量下限由 `full` job 断言，它驱动真实模型。
  SMOKE_THRESH: ${{ github.event.inputs.pass_threshold || '0' }}

jobs:
  smoke:
    name: 冒烟评测（确定性回放）
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce_secret
          POSTGRES_DB: ecommerce_agents
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ecommerce"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]

    env:
      LLM_PROVIDER: replay
      REPLAY_FIXTURES_DIR: evals/fixtures/replay

    steps:
      - uses: actions/checkout@v4

      - name: 安装 uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: agents/python/uv.lock

      - name: 安装 Python 3.12
        run: uv python install 3.12

      - name: 同步依赖
        working-directory: agents/python
        run: uv sync --extra dev

      - name: 载入数据库 schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f docker/postgres/init.sql

      # scripts.seed / scripts.generate_embeddings 位于仓库根目录，而不是
      # agents/python/ 内 —— docker-compose 的 seeder 服务通过卷挂载
      # (./scripts:/app/scripts:ro) 解析它，而这里没有该挂载，因此这两个步骤
      # 从仓库根目录运行，并显式把 uv 指向 agents/python 项目。
      - name: 写入确定性演示数据
        run: uv run --project agents/python python -m scripts.seed

      - name: 生成向量嵌入
        run: uv run --project agents/python python -m scripts.generate_embeddings

      - name: 启动专业智能体服务（回放模式 —— 无 key、零成本）
        working-directory: agents/python
        run: |
          for svc in product_discovery:8081 order_management:8082 pricing_promotions:8083 review_sentiment:8084 inventory_fulfillment:8085; do
            name="${svc%%:*}"; port="${svc##*:}"
            AGENT_NAME="$name" AGENT_PORT="$port" \
              nohup uv run --no-project uvicorn "${name}.main:app" --host 0.0.0.0 --port "$port" \
              > "/tmp/${name}.log" 2>&1 &
          done
          for port in 8081 8082 8083 8084 8085; do
            for _ in $(seq 1 30); do
              curl -sf "http://localhost:$port/health" > /dev/null && break
              sleep 1
            done
            curl -sf "http://localhost:$port/health" > /dev/null || {
              echo "::error::端口 $port 上的专业智能体始终未变为健康"
              cat /tmp/*.log
              exit 1
            }
          done

      - name: 对回放 fixture 与已提交基线运行全部套件
        working-directory: agents/python
        run: |
          fail=0
          for a in product-discovery order-management pricing-promotions review-sentiment inventory-fulfillment; do
            ds="evals/datasets/${a//-/_}.json"
            base="evals/baselines/${a//-/_}.json"
            echo "::group::quality eval — $a"
            uv run python -m evals.run_evals --agent "$a" --dataset "$ds" \
              --pass-threshold "$SMOKE_THRESH" --baseline "$base" --max-regression 0.05 \
              --output-json "eval-$a.json" || fail=1
            echo "::endgroup::"
          done
          echo "::group::routing eval — orchestrator"
          uv run python -m evals.run_evals --agent orchestrator \
            --dataset evals/datasets/orchestrator_routing.json \
            --pass-threshold "$SMOKE_THRESH" --baseline evals/baselines/orchestrator_routing.json --max-regression 0.05 \
            --output-json eval-orchestrator.json || fail=1
          echo "::endgroup::"
          echo "::group::safety / red-team"
          uv run python -m evals.run_evals --suite safety \
            --pass-threshold 0.8 --output-json eval-safety.json || fail=1
          echo "::endgroup::"
          exit $fail

      # 专业智能体是以 `nohup ... &` 启动的，否则当 job 的后置步骤执行时它们仍在运行。
      # 那时 `setup-uv` 的缓存清理步骤会在这些进程持有的 uv 缓存上挂住，
      # 并在其 300 秒超时处被杀死，让 job 在所有真实工作都已成功之后才失败。
      # 一个 job 应该停掉自己启动的东西。
      - name: 停止专业智能体服务
        if: always()
        run: |
          pkill -f "uvicorn .*\.main:app" || true
          sleep 2
          pkill -9 -f "uvicorn .*\.main:app" || true

      - name: 上传评测结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-smoke
          path: agents/python/eval-*.json
          retention-days: 30

  full:
    name: 完整评测（真实模型与评判，仅手动）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch'

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: ecommerce
          POSTGRES_PASSWORD: ecommerce_secret
          POSTGRES_DB: ecommerce_agents
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ecommerce"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7
        ports: ["6379:6379"]

    env:
      LLM_PROVIDER: openai
      LLM_MODEL: gpt-4.1
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: 要求提供 OPENAI_API_KEY
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "::error::OPENAI_API_KEY secret 未设置 —— 请在仓库设置中添加它，才能运行完整评测套件。"
            exit 1
          fi

      - name: 安装 uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: agents/python/uv.lock

      - name: 安装 Python 3.12
        run: uv python install 3.12

      - name: 同步依赖
        working-directory: agents/python
        run: uv sync --extra dev

      - name: 载入数据库 schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f docker/postgres/init.sql

      # scripts.seed / scripts.generate_embeddings 位于仓库根目录，而不是
      # agents/python/ 内 —— docker-compose 的 seeder 服务通过卷挂载
      # (./scripts:/app/scripts:ro) 解析它，而这里没有该挂载，因此这两个步骤
      # 从仓库根目录运行，并显式把 uv 指向 agents/python 项目。
      - name: 写入确定性演示数据
        run: uv run --project agents/python python -m scripts.seed

      - name: 生成向量嵌入
        run: uv run --project agents/python python -m scripts.generate_embeddings

      - name: 启动专业智能体服务（真实 key）
        working-directory: agents/python
        run: |
          for svc in product_discovery:8081 order_management:8082 pricing_promotions:8083 review_sentiment:8084 inventory_fulfillment:8085; do
            name="${svc%%:*}"; port="${svc##*:}"
            AGENT_NAME="$name" AGENT_PORT="$port" \
              nohup uv run --no-project uvicorn "${name}.main:app" --host 0.0.0.0 --port "$port" \
              > "/tmp/${name}.log" 2>&1 &
          done
          for port in 8081 8082 8083 8084 8085; do
            for _ in $(seq 1 30); do
              curl -sf "http://localhost:$port/health" > /dev/null && break
              sleep 1
            done
            curl -sf "http://localhost:$port/health" > /dev/null || {
              echo "::error::端口 $port 上的专业智能体始终未变为健康"
              cat /tmp/*.log
              exit 1
            }
          done

      - name: 运行质量 + 安全评测（真实评判、真实 key）
        working-directory: agents/python
        run: |
          fail=0
          for a in product-discovery order-management pricing-promotions review-sentiment inventory-fulfillment; do
            ds="evals/datasets/${a//-/_}.json"
            base="evals/baselines/${a//-/_}.json"
            echo "::group::quality eval — $a"
            uv run python -m evals.run_evals --agent "$a" --dataset "$ds" \
              --pass-threshold "$THRESH" --use-llm-judge \
              --baseline "$base" --max-regression 0.05 \
              --output-json "eval-$a.json" || fail=1
            echo "::endgroup::"
          done
          echo "::group::routing eval — orchestrator"
          uv run python -m evals.run_evals --agent orchestrator \
            --dataset evals/datasets/orchestrator_routing.json \
            --pass-threshold "$THRESH" --use-llm-judge \
            --baseline evals/baselines/orchestrator_routing.json --max-regression 0.05 \
            --output-json eval-orchestrator.json || fail=1
          echo "::endgroup::"
          echo "::group::safety / red-team"
          uv run python -m evals.run_evals --suite safety \
            --pass-threshold 0.8 --output-json eval-safety.json || fail=1
          echo "::endgroup::"
          exit $fail

      # 专业智能体是以 `nohup ... &` 启动的，否则当 job 的后置步骤执行时它们仍在运行。
      # 那时 `setup-uv` 的缓存清理步骤会在这些进程持有的 uv 缓存上挂住，
      # 并在其 300 秒超时处被杀死，让 job 在所有真实工作都已成功之后才失败。
      # 一个 job 应该停掉自己启动的东西。
      - name: 停止专业智能体服务
        if: always()
        run: |
          pkill -f "uvicorn .*\.main:app" || true
          sleep 2
          pkill -9 -f "uvicorn .*\.main:app" || true

      - name: 上传评测结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-full
          path: agents/python/eval-*.json
          retention-days: 30
