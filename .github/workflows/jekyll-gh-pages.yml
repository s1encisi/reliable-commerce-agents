# 构建文档站点并部署到 GitHub Pages。
#
# 与直接用 just-the-docs 发布 `docs/` 的常见做法相比，本工作流有一处关键不同：
# 站点是**先被生成**的。
#
# `scripts/build_docs_site.py` 从三棵独立的树 —— docs/、docs/concepts/ 与 34 个教程
# 章节 —— 组装出 `_site_src/`，注入 Jekyll front matter 并重写每一条跨树链接。
# 这让仓库里不含 front matter，否则在 GitHub 上阅读时它会渲染成每个文件顶部的
# 元数据表格。仓库仍是唯一事实来源；站点只是它的一种渲染结果。
name: 部署文档站点到 GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tutorials/**"
      - "scripts/build_docs_site.py"
      - ".github/workflows/jekyll-gh-pages.yml"
  pull_request:
    paths:
      - "docs/**"
      - "tutorials/**"
      - "scripts/build_docs_site.py"
      - ".github/workflows/jekyll-gh-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 绝不取消进行中的生产部署。
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 在 pull request 上也会运行，而 deploy job 不会。链接烂掉的站点比没有站点更糟，
      # 而一条断掉的跨树链接正是那种只有把各棵树合并进同一个 URL 空间后才会暴露的问题 ——
      # 所以它必须让 PR 失败，而不是让部署失败。
      - name: 检查生成的站点（front matter、导航父级、链接）
        run: python scripts/build_docs_site.py --check

      - name: 生成站点源码
        run: python scripts/build_docs_site.py

      - name: 用 Jekyll 构建
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_site_src
          destination: ./_site

      - name: 上传产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    # pull request 只构建与检查链接，从不发布。
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
