# ============================================================
# 可靠电商多智能体平台 — Docker Compose
# 用法：./scripts/dev.sh（或 docker compose up --build）
# ============================================================

# Compose 项目名，显式指定。
#
# 若不指定，本目录下的每个 compose 文件都会解析为同一个项目（取目录名），
# 导致不同环境共用容器名，`docker compose down` 只关掉其中一组、另一组变成
# 孤儿容器残留。显式命名后，各环境互相独立、可单独寻址。
name: reliable-commerce-agents

services:
  # ── Infrastructure ─────────────────────────────────────────

  db:
    image: pgvector/pgvector:pg16
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: ecommerce_agents
      POSTGRES_USER: ecommerce
      POSTGRES_PASSWORD: ecommerce_secret
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ecommerce -d ecommerce_agents"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ── Jaeger（OpenTelemetry 追踪可视化）────────────────────────

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports:
      - "16686:16686"   # Jaeger 查询界面
      - "4317:4317"     # OTLP gRPC 接收端
      - "4318:4318"     # OTLP HTTP 接收端
    environment:
      COLLECTOR_OTLP_ENABLED: "true"

  # ── Seed Database (runs once, exits) ────────────────────────

  seeder:
    build:
      context: ./agents/python
      args:
        AGENT_NAME: orchestrator
    working_dir: /app
    command: uv run --no-project python -m scripts.seed
    volumes:
      - ./scripts:/app/scripts:ro
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://ecommerce:ecommerce_secret@db:5432/ecommerce_agents
      OAUTH_SEED_KEY: ${OAUTH_SEED_KEY:-dev-oauth-seed-change-me}
    restart: "no"
    profiles: ["seed"]

  # ── 自托管 OAuth2 授权服务器（可选 — AUTH_MODE=oauth）──────
  #
  # 签发 RS256 令牌，覆盖用户登录（由编排器代理的 ROPC 流程）、
  # 智能体间 A2A 调用（client credentials）以及 MCP 资源访问。
  # 不依赖任何外部身份提供商 —— 下列 JWKS / token 端点即为本栈
  # 唯一的鉴权中心。AUTH_MODE=local（默认）时不需要启动本服务。

  auth-server:
    build:
      context: ./agents/python
      args:
        AGENT_NAME: auth_server
        AGENT_PORT: 8090
    ports: ["8090:8090"]
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://ecommerce:ecommerce_secret@db:5432/ecommerce_agents
      AUTH_SERVER_ISSUER: http://auth-server:8090
      AUTH_RSA_KEY_SIZE: ${AUTH_RSA_KEY_SIZE:-2048}
      AUTH_SIGNING_KEY_ENCRYPTION_KEY: ${AUTH_SIGNING_KEY_ENCRYPTION_KEY:-}
      AUTH_ACCESS_TOKEN_TTL: ${AUTH_ACCESS_TOKEN_TTL:-3600}
      AUTH_REFRESH_TOKEN_TTL: ${AUTH_REFRESH_TOKEN_TTL:-604800}
      OAUTH_SEED_KEY: ${OAUTH_SEED_KEY:-dev-oauth-seed-change-me}
      AUTH_SERVER_AUDIENCE: ${AUTH_SERVER_AUDIENCE:-ecommerce-auth-server}
      AUTH_ALLOW_DYNAMIC_REGISTRATION: ${AUTH_ALLOW_DYNAMIC_REGISTRATION:-false}
      ENVIRONMENT: ${ENVIRONMENT:-development}
    profiles: ["agents"]

  # ── 编排器（面向用户的统一入口智能体）─────────────────────

  orchestrator:
    build:
      context: ./agents/python
      args:
        AGENT_NAME: orchestrator
        AGENT_PORT: 8080
    ports: ["8080:8080"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }

    environment: &agent-env
      DATABASE_URL: postgresql://ecommerce:ecommerce_secret@db:5432/ecommerce_agents
      REDIS_URL: redis://redis:6379
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4.1}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_KEY: ${AZURE_OPENAI_KEY:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2025-03-01-preview}
      AZURE_EMBEDDING_DEPLOYMENT: ${AZURE_EMBEDDING_DEPLOYMENT:-}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production-use-random-256-bit-key}
      AGENT_SHARED_SECRET: ${AGENT_SHARED_SECRET:-agent-internal-shared-secret}
      # OAuth2 (self-hosted auth-server, optional — AUTH_MODE=oauth). Every
      # value here is additive; AUTH_MODE defaults to "local" so none of
      # this changes behavior unless explicitly opted in.
      AUTH_MODE: ${AUTH_MODE:-local}
      AUTH_SERVER_ISSUER: http://auth-server:8090
      AUTH_SERVER_JWKS_URL: http://auth-server:8090/.well-known/jwks.json
      AUTH_SERVER_TOKEN_URL: http://auth-server:8090/oauth/token
      AUTH_JWKS_CACHE_TTL: ${AUTH_JWKS_CACHE_TTL:-900}
      AUTH_ORCH_AUDIENCE: ${AUTH_ORCH_AUDIENCE:-ecommerce-orchestrator}
      AUTH_AGENT_AUDIENCE: ${AUTH_AGENT_AUDIENCE:-ecommerce-agents}
      OAUTH_CLIENT_ID: orchestrator
      OAUTH_CLIENT_SECRET: ${OAUTH_CLIENT_SECRET:-}
      OAUTH_SEED_KEY: ${OAUTH_SEED_KEY:-dev-oauth-seed-change-me}
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: ecommerce.orchestrator
      # 是否在 Jaeger 的 GenAI 视图中采集 LLM 输入/输出内容
      # 处理个人敏感信息的生产环境请置为 "false"
      OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT: ${OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT:-true}
      # MAF v1 功能开关 —— 默认值保持现有行为；如需调整
      # RETURN_HITL_THRESHOLD 等阈值，改这里即可，无需进入容器内修改。
      MAF_SESSION_BACKEND: ${MAF_SESSION_BACKEND:-postgres}
      MAF_CHECKPOINT_BACKEND: ${MAF_CHECKPOINT_BACKEND:-postgres}
      ORCHESTRATION_MODE: ${ORCHESTRATION_MODE:-tool}
      RETURN_HITL_THRESHOLD: ${RETURN_HITL_THRESHOLD:-500}
      HANDOFF_AUTONOMOUS_MODE: ${HANDOFF_AUTONOMOUS_MODE:-true}
      AGENT_REGISTRY: >-
        {
          "product-discovery": "http://product-discovery:8081",
          "order-management": "http://order-management:8082",
          "pricing-promotions": "http://pricing-promotions:8083",
          "review-sentiment": "http://review-sentiment:8084",
          "inventory-fulfillment": "http://inventory-fulfillment:8085"
        }
    profiles: ["agents"]

  # ── Specialist Agents ──────────────────────────────────────

  product-discovery:
    build:
      context: ./agents/python
      args: { AGENT_NAME: product_discovery, AGENT_PORT: 8081 }
    ports: ["8081:8081"]
    depends_on:
      db: { condition: service_healthy }

    environment:
      <<: *agent-env
      OTEL_SERVICE_NAME: ecommerce.product-discovery
      OAUTH_CLIENT_ID: product-discovery
      # MCP integration (optional — off by default; enable with the mcp
      # profile's mcp-product service also running).
      MCP_ENABLED: ${MCP_ENABLED:-false}
      MCP_AUTH_ENABLED: ${MCP_AUTH_ENABLED:-false}
      MCP_PRODUCT_SERVER_URL: http://mcp-product:9000/mcp
      MCP_PRODUCT_AUDIENCE: ${MCP_PRODUCT_AUDIENCE:-mcp-product}
      MCP_PRODUCT_REQUIRED_SCOPE: ${MCP_PRODUCT_REQUIRED_SCOPE:-mcp:product}
    profiles: ["agents"]

  order-management:
    build:
      context: ./agents/python
      args: { AGENT_NAME: order_management, AGENT_PORT: 8082 }
    ports: ["8082:8082"]
    depends_on:
      db: { condition: service_healthy }

    environment:
      <<: *agent-env
      OTEL_SERVICE_NAME: ecommerce.order-management
      OAUTH_CLIENT_ID: order-management
    profiles: ["agents"]

  pricing-promotions:
    build:
      context: ./agents/python
      args: { AGENT_NAME: pricing_promotions, AGENT_PORT: 8083 }
    ports: ["8083:8083"]
    depends_on:
      db: { condition: service_healthy }

    environment:
      <<: *agent-env
      OTEL_SERVICE_NAME: ecommerce.pricing-promotions
      OAUTH_CLIENT_ID: pricing-promotions
    profiles: ["agents"]

  review-sentiment:
    build:
      context: ./agents/python
      args: { AGENT_NAME: review_sentiment, AGENT_PORT: 8084 }
    ports: ["8084:8084"]
    depends_on:
      db: { condition: service_healthy }

    environment:
      <<: *agent-env
      OTEL_SERVICE_NAME: ecommerce.review-sentiment
      OAUTH_CLIENT_ID: review-sentiment
    profiles: ["agents"]

  inventory-fulfillment:
    build:
      context: ./agents/python
      args: { AGENT_NAME: inventory_fulfillment, AGENT_PORT: 8085 }
    ports: ["8085:8085"]
    depends_on:
      db: { condition: service_healthy }

    environment:
      <<: *agent-env
      OTEL_SERVICE_NAME: ecommerce.inventory-fulfillment
      OAUTH_CLIENT_ID: inventory-fulfillment
      # MCP integration (optional — off by default; enable with the mcp
      # profile's mcp-inventory service also running).
      MCP_ENABLED: ${MCP_ENABLED:-false}
      MCP_AUTH_ENABLED: ${MCP_AUTH_ENABLED:-false}
      MCP_INVENTORY_SERVER_URL: http://mcp-inventory:9001/mcp
      MCP_INVENTORY_AUDIENCE: ${MCP_INVENTORY_AUDIENCE:-mcp-inventory}
      MCP_INVENTORY_REQUIRED_SCOPE: ${MCP_INVENTORY_REQUIRED_SCOPE:-mcp:inventory}
    profiles: ["agents"]

  # ── MCP Servers (optional — enable with MCP_ENABLED=true) ──────
  #
  # Each server is a standalone publishable package under packages/.
  # Built with Dockerfile.mcp which installs only that package's deps,
  # keeping the image lean and independent of the main agent application.

  # Product Discovery MCP server — product search, details, comparison,
  # trending products, and price history via MCP streamable HTTP.
  mcp-product:
    build:
      context: ./agents/python
      dockerfile: Dockerfile.mcp
      args:
        MCP_PACKAGE: ecommerce-mcp-product
        MCP_DIR: packages/mcp-product
        MCP_MODULE: ecommerce_mcp_product.server:app
        MCP_PORT: 9000
    ports: ["9000:9000"]
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://ecommerce:ecommerce_secret@db:5432/ecommerce_agents
      # OAuth 2.1 resource-server mode (optional — off by default).
      MCP_AUTH_ENABLED: ${MCP_AUTH_ENABLED:-false}
      AUTH_SERVER_ISSUER: http://auth-server:8090
      AUTH_SERVER_JWKS_URL: http://auth-server:8090/.well-known/jwks.json
      MCP_PRODUCT_AUDIENCE: ${MCP_PRODUCT_AUDIENCE:-mcp-product}
      MCP_PRODUCT_REQUIRED_SCOPE: ${MCP_PRODUCT_REQUIRED_SCOPE:-mcp:product}
      MCP_PRODUCT_RESOURCE_URL: http://localhost:9000/mcp
    healthcheck:
      # When MCP_AUTH_ENABLED=true, /mcp is wrapped in RequireAuthMiddleware
      # and always 401s — probe the SDK's auto-mounted, unauthenticated
      # protected-resource metadata endpoint instead.
      test:
        [
          "CMD-SHELL",
          "if [ \"$$MCP_AUTH_ENABLED\" = \"true\" ]; then curl -sf http://localhost:9000/.well-known/oauth-protected-resource/mcp; else curl -sf http://localhost:9000/mcp; fi",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    profiles: ["mcp"]

  # Inventory & Fulfillment MCP server — stock levels, warehouses, shipping, carriers.
  mcp-inventory:
    build:
      context: ./agents/python
      dockerfile: Dockerfile.mcp
      args:
        MCP_PACKAGE: ecommerce-mcp-inventory
        MCP_DIR: packages/mcp-inventory
        MCP_MODULE: ecommerce_mcp_inventory.server:app
        MCP_PORT: 9001
    ports: ["9001:9001"]
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://ecommerce:ecommerce_secret@db:5432/ecommerce_agents
      # OAuth 2.1 resource-server mode (optional — off by default).
      MCP_AUTH_ENABLED: ${MCP_AUTH_ENABLED:-false}
      AUTH_SERVER_ISSUER: http://auth-server:8090
      AUTH_SERVER_JWKS_URL: http://auth-server:8090/.well-known/jwks.json
      MCP_INVENTORY_AUDIENCE: ${MCP_INVENTORY_AUDIENCE:-mcp-inventory}
      MCP_INVENTORY_REQUIRED_SCOPE: ${MCP_INVENTORY_REQUIRED_SCOPE:-mcp:inventory}
      MCP_INVENTORY_RESOURCE_URL: http://localhost:9001/mcp
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "if [ \"$$MCP_AUTH_ENABLED\" = \"true\" ]; then curl -sf http://localhost:9001/.well-known/oauth-protected-resource/mcp; else curl -sf http://localhost:9001/mcp; fi",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
    profiles: ["mcp"]

  # ── Frontend ────────────────────────────────────────────────

  frontend:
    build:
      context: ./web
    ports: ["3000:3000"]
    environment:
      # Server-side, not NEXT_PUBLIC_*: the browser calls the frontend's own
      # origin and Next forwards from there, so this is a container-network
      # address rather than a host-published one.
      ORCHESTRATOR_URL: http://orchestrator:8080
    depends_on:
      orchestrator: { condition: service_started }
    profiles: ["frontend"]

volumes:
  pgdata:
